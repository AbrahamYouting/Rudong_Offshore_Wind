name: 部署到 GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 组装发布目录（只发布站点，不含测试与截图）
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -rf _site/tests _site/screenshots
          touch _site/.nojekyll
          find _site -type f | sort

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库第一次推送时 Pages 还没启用，让这个 action 自己把站点打开，
          # 省掉"去 Settings → Pages 手动选 GitHub Actions"那一步。
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
